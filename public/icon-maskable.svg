  <rect x="226" y="261" width="64" height="10" rx="3" ry="3" fill="#E5E7EB"/>

  <!-- Task 4 - Unchecked -->
  <rect x="196" y="296" width="20" height="20" rx="5" ry="5" fill="none" stroke="#D1D5DB" stroke-width="2.5"/>
  <rect x="226" y="301" width="94" height="10" rx="3" ry="3" fill="#E5E7EB"/>

  <!-- Family dots in corner (inside safe zone) -->
