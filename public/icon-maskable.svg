  <rect x="232" y="132" width="48" height="16" rx="4" ry="4" fill="#8B5CF6"/>

  <!-- Todo lines with checkboxes -->
  <!-- Task 1 - Checked -->
  <rect x="196" y="176" width="20" height="20" rx="5" ry="5" fill="#10B981"/>
  <path d="M201 186 L204 189 L210 181" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="226" y="181" width="90" height="10" rx="3" ry="3" fill="#E5E7EB"/>

  <!-- Task 2 - Checked -->
  <rect x="196" y="216" width="20" height="20" rx="5" ry="5" fill="#10B981"/>
  <path d="M201 226 L204 229 L210 221" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
